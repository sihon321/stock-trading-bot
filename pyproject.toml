[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading-bot"
version = "0.1.0"
description = "Safety-first Korean-market stock trading bot foundation."
readme = ".planning/PROJECT.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings==2.11.0",
    "pydantic==2.13.4",
    "pytest==8.4.2",
    "pykrx==1.2.8",
    "ta==0.11.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "tenacity==9.1.4",
    "anthropic==0.115.1",
    "openai==2.44.0",
    "structlog==25.5.0",
    "typer==0.26.8",
    "python-dotenv==1.2.2",
]

[project.scripts]
bot = "trading_bot.cli:app"
bot-web = "trading_bot.web_cli:app"
bot-alerts = "trading_bot.alert_cli:app"
bot-service = "trading_bot.service_cli:app"
bot-account = "trading_bot.account_refresh:app"

[project.optional-dependencies]
web = ["Flask==3.1.3", "Flask-WTF==1.3.0", "waitress==3.0.2", "Werkzeug==3.1.9", "Jinja2==3.1.6"]
browser = ["playwright==1.63.0", "pytest-playwright==0.9.0"]

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.setuptools.package-data]
trading_bot = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["browser: requires the reviewed browser extra and installed Chromium; missing prerequisites are errors"]
